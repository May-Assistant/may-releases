name: May backend checks at a may-app pull request head (typecheck, migrations, tests; pass or fail and counts only)
# The pull request number and head SHA only (both public in this log already): backend_ci_schedule.py reads it to run a
# head once.
run-name: 'May backend checks for may-app #${{ inputs.pr_number }} at ${{ inputs.source_sha }}'
on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Open May-Assistant/may-app pull request against main (not from a fork)
        required: true
        type: string
      source_sha:
        description: That pull request's current 40-character head commit
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: may-backend-unit-pr
  cancel-in-progress: false
jobs:
  admission:
    # may-app's backend-ci.yml (switched off there: private Actions are blocked by billing), run at the head of an open
    # may-app pull request on a free Linux runner: the pinned Node 22.22.0, a Postgres 16.15 service container pinned
    # by digest, then npm ci, typecheck, migrations from scratch twice with the ledger check, and npm test
    # (backend_unit.py STAGES). The same gate, fetch and environment as android-unit-pr.yml (gate.py --action
    # compile-pr: may-native-compile-pr, no required reviewer, main only), because it holds the same things: two
    # read-only deploy keys and a pull-request read token, each in its own step, and the pull-request comment token in
    # the post alone. Nothing is signed or uploaded. Every stage's output stays in a private log, only fixed lines with
    # counts are printed, and the failures go only to the may-app pull request (backend_unit_post.py).
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      environment: ${{ steps.gate.outputs.environment }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          MAY_SOURCE_SHA: ${{ inputs.source_sha }}
          MAY_PR_NUMBER: ${{ inputs.pr_number }}
        run: python3 -I -S -B tools/may_release/gate.py --action compile-pr --source-sha "$MAY_SOURCE_SHA" --pr-number "$MAY_PR_NUMBER"
  backend:
    needs: admission
    runs-on: ubuntu-24.04
    environment: ${{ needs.admission.outputs.environment }}
    # backend-ci.yml's 20 minutes (about 3x a normal run); npm test alone stops at 15 (backend_unit.TEST_SECONDS).
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    # backend-ci.yml's throwaway cluster: superuser may_admin with trust auth on the runner's loopback, which
    # backend_unit.py reaches as MAY_TEST_ADMIN_URL. Nothing in it outlives the job.
    services:
      postgres:
        image: postgres:16.15@sha256:ca0bd484cb98bf4b24eb1010e73fb3fcbd6714d240fbc1a10eea5b7dbecb641d
        env:
          POSTGRES_USER: may_admin
          POSTGRES_DB: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U may_admin -d postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Mint the May CI token for MAY_APP_PR_READ_TOKEN, before any pull request code
        id: ci-read
        if: vars.MAY_CI_APP_ID != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.MAY_CI_APP_ID }}
          private-key: ${{ secrets.MAY_CI_APP_PRIVATE_KEY }}
          owner: May-Assistant
          repositories: may-app
          permission-pull-requests: read
      - name: Mint the May CI token for MAY_APP_PR_COMMENT_TOKEN, before any pull request code
        id: ci-comment
        if: vars.MAY_CI_APP_ID != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.MAY_CI_APP_ID }}
          private-key: ${{ secrets.MAY_CI_APP_PRIVATE_KEY }}
          owner: May-Assistant
          repositories: may-app
          permission-pull-requests: write
      - name: Install the pinned, checksum-verified Node
        run: python3 -I -S -B tools/may_release/toolchain.py node
      - name: Check the pull request head and environment before fetching
        env:
          GH_TOKEN: ${{ github.token }}
          MAY_APP_PR_READ_TOKEN: ${{ steps.ci-read.outputs.token || secrets.MAY_APP_PR_READ_TOKEN }}
          MAY_SOURCE_SHA: ${{ inputs.source_sha }}
          MAY_PR_NUMBER: ${{ inputs.pr_number }}
        run: python3 -I -S -B tools/may_release/gate.py --action compile-pr --source-sha "$MAY_SOURCE_SHA" --pr-number "$MAY_PR_NUMBER" --check-pull
      # prepare.py's pull-request fetch, exactly as android-unit-pr.yml's: it also places the design system at its
      # Android pin, which the backend never reads.
      - name: Fetch the pull request head and pinned design system quietly
        env:
          MAY_SOURCE_SHA: ${{ inputs.source_sha }}
          MAY_PR_NUMBER: ${{ inputs.pr_number }}
          MAY_APP_READ_KEY: ${{ secrets.MAY_APP_READ_KEY }}
          MAY_DS_READ_KEY: ${{ secrets.MAY_DS_READ_KEY }}
        run: python3 -I -S -B tools/may_release/prepare.py --platform android --target playground --source-sha "$MAY_SOURCE_SHA" --pr-number "$MAY_PR_NUMBER"
      - name: Run the backend checks without any credential, printing only pass or fail and counts
        env:
          MAY_SOURCE_SHA: ${{ inputs.source_sha }}
        run: python3 -I -S -B tools/may_release/backend_unit.py --source-sha "$MAY_SOURCE_SHA" --record-outcome
      - name: Post the backend failures on the may-app pull request, never in this log
        env:
          MAY_SOURCE_SHA: ${{ inputs.source_sha }}
          MAY_PR_NUMBER: ${{ inputs.pr_number }}
          MAY_APP_PR_COMMENT_TOKEN: ${{ steps.ci-comment.outputs.token || secrets.MAY_APP_PR_COMMENT_TOKEN }}
        run: python3 -I -S -B tools/may_release/backend_unit_post.py --source-sha "$MAY_SOURCE_SHA" --pr-number "$MAY_PR_NUMBER"
      - name: Remove private source, logs, dependencies and the pinned Node
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/may-source" "$RUNNER_TEMP/may-design-system" "$RUNNER_TEMP/may-private" "$RUNNER_TEMP/may-npm" "$RUNNER_TEMP/may-tools"
