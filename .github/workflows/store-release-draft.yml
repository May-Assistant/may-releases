name: May protected store release (inactive draft)
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Store platform
        required: true
        type: choice
        options: [ios, android]
      target:
        description: Separate May or May Playground store app
        required: true
        type: choice
        options: [production, playground]
      source_sha:
        description: Reviewed 40-character May app commit in main history
        required: true
        type: string
      build_number:
        description: Unused positive build number for this app
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: may-store-release
  cancel-in-progress: false
jobs:
  admission:
    # A later reviewed change must enable this job after all four environments,
    # private keys, signing credentials and store identities have been verified.
    if: ${{ github.event_name == 'may-store-disabled-pending-review' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      deployments: read
    outputs:
      environment: ${{ steps.gate.outputs.environment }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          MAY_PLATFORM: ${{ inputs.platform }}
          MAY_TARGET: ${{ inputs.target }}
          MAY_SOURCE_SHA: ${{ inputs.source_sha }}
          MAY_BUILD_NUMBER: ${{ inputs.build_number }}
        run: python3 tools/may_release/gate.py --action "$MAY_PLATFORM" --target "$MAY_TARGET" --source-sha "$MAY_SOURCE_SHA" --build-number "$MAY_BUILD_NUMBER"
  ios:
    needs: admission
    if: ${{ github.event_name == 'may-store-disabled-pending-review' && inputs.platform == 'ios' }}
    runs-on: macos-15
    environment: ${{ needs.admission.outputs.environment }}
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read
      deployments: read
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      MAY_PLATFORM: ${{ inputs.platform }}
      MAY_TARGET: ${{ inputs.target }}
      MAY_SOURCE_SHA: ${{ inputs.source_sha }}
      MAY_BUILD_NUMBER: ${{ inputs.build_number }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Recheck protected destination after Samuel's review
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/may_release/gate.py --action ios --target "$MAY_TARGET" --source-sha "$MAY_SOURCE_SHA" --build-number "$MAY_BUILD_NUMBER"
      - name: Fetch exact private source and pinned design system
        env:
          MAY_APP_READ_KEY: ${{ secrets.MAY_APP_READ_KEY }}
          MAY_DS_READ_KEY: ${{ secrets.MAY_DS_READ_KEY }}
        run: python3 tools/may_release/prepare.py --source-sha "$MAY_SOURCE_SHA"
      - name: Sign and submit this app's IPA for internal TestFlight
        env:
          MAY_IOS_CERT_BASE64: ${{ secrets.MAY_IOS_CERT_BASE64 }}
          MAY_IOS_CERT_PASSWORD: ${{ secrets.MAY_IOS_CERT_PASSWORD }}
          MAY_IOS_PROFILE_BASE64: ${{ secrets.MAY_IOS_PROFILE_BASE64 }}
          MAY_ASC_KEY_BASE64: ${{ secrets.MAY_ASC_KEY_BASE64 }}
          MAY_ASC_KEY_ID: ${{ vars.MAY_ASC_KEY_ID }}
          MAY_ASC_ISSUER_ID: ${{ secrets.MAY_ASC_ISSUER_ID }}
        run: python3 tools/may_release/store.py --platform ios --target "$MAY_TARGET" --source-sha "$MAY_SOURCE_SHA" --build-number "$MAY_BUILD_NUMBER"
      - name: Remove task-owned private source and signing material
        if: always()
        run: |
          if [ -n "${RUNNER_TEMP:-}" ] && [ -d "$RUNNER_TEMP" ]; then
            rm -rf -- "$RUNNER_TEMP/may-source" "$RUNNER_TEMP/may-private" "$RUNNER_TEMP/may-design-system" "$RUNNER_TEMP/may-release" "$RUNNER_TEMP/may-android."* "$RUNNER_TEMP/may-ios."*
          fi
  android:
    needs: admission
    if: ${{ github.event_name == 'may-store-disabled-pending-review' && inputs.platform == 'android' }}
    runs-on: ubuntu-24.04
    environment: ${{ needs.admission.outputs.environment }}
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read
      deployments: read
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      MAY_PLATFORM: ${{ inputs.platform }}
      MAY_TARGET: ${{ inputs.target }}
      MAY_SOURCE_SHA: ${{ inputs.source_sha }}
      MAY_BUILD_NUMBER: ${{ inputs.build_number }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Recheck protected destination after Samuel's review
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/may_release/gate.py --action android --target "$MAY_TARGET" --source-sha "$MAY_SOURCE_SHA" --build-number "$MAY_BUILD_NUMBER"
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Fetch exact private source and pinned design system
        env:
          MAY_APP_READ_KEY: ${{ secrets.MAY_APP_READ_KEY }}
          MAY_DS_READ_KEY: ${{ secrets.MAY_DS_READ_KEY }}
        run: python3 tools/may_release/prepare.py --source-sha "$MAY_SOURCE_SHA"
      - name: Test and sign selected Android App Bundle
        env:
          MAY_ANDROID_KEYSTORE_BASE64: ${{ secrets.MAY_ANDROID_KEYSTORE_BASE64 }}
          MAY_ANDROID_STORE_PASSWORD: ${{ secrets.MAY_ANDROID_STORE_PASSWORD }}
          MAY_ANDROID_KEY_PASSWORD: ${{ secrets.MAY_ANDROID_KEY_PASSWORD }}
          MAY_ANDROID_KEY_ALIAS: ${{ vars.MAY_ANDROID_KEY_ALIAS }}
          MAY_ANDROID_CERT_SHA256: ${{ vars.MAY_ANDROID_CERT_SHA256 }}
          MAY_PLAY_JSON: ${{ secrets.MAY_PLAY_JSON }}
          MAY_PLAY_ACCOUNT: ${{ vars.MAY_PLAY_ACCOUNT }}
        run: python3 tools/may_release/store.py --platform android --target "$MAY_TARGET" --source-sha "$MAY_SOURCE_SHA" --build-number "$MAY_BUILD_NUMBER"
      - name: Submit only the first internal-track release
        env:
          MAY_PLAY_JSON: ${{ secrets.MAY_PLAY_JSON }}
          MAY_PLAY_ACCOUNT: ${{ vars.MAY_PLAY_ACCOUNT }}
        run: |
          python3 -m venv "$RUNNER_TEMP/may-private/play-venv"
          "$RUNNER_TEMP/may-private/play-venv/bin/pip" install --disable-pip-version-check --no-input 'google-auth[requests]==2.40.3' > "$RUNNER_TEMP/may-private/pip.log" 2>&1 || { echo 'Protected Play client setup failed'; exit 1; }
          "$RUNNER_TEMP/may-private/play-venv/bin/python" tools/may_release/play_upload.py --target "$MAY_TARGET" --source-sha "$MAY_SOURCE_SHA" --build-number "$MAY_BUILD_NUMBER"
      - name: Remove task-owned private source, bundle, keys and logs
        if: always()
        run: |
          if [ -n "${RUNNER_TEMP:-}" ] && [ -d "$RUNNER_TEMP" ]; then
            rm -rf -- "$RUNNER_TEMP/may-source" "$RUNNER_TEMP/may-private" "$RUNNER_TEMP/may-design-system" "$RUNNER_TEMP/may-release" "$RUNNER_TEMP/may-android."* "$RUNNER_TEMP/may-ios."*
          fi
