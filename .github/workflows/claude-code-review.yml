name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          persist-credentials: false

      # The plugin marketplace is checked out at a pinned commit (2026-09-29) and
      # passed as a local path; the action accepts only *.git URLs otherwise.
      - name: Checkout pinned Claude Code plugin marketplace
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: anthropics/claude-code
          ref: 0d7f14dd352fa67affd4e172eb1b6f524dbd709e
          path: .claude-marketplace/claude-code
          fetch-depth: 1
          persist-credentials: false

      # Claude Code reserves the marketplace name "claude-code-plugins" for GitHub sources from the
      # anthropics organization, and refuses it from a local path. Rename the pinned copy; its plugins
      # are unchanged.
      - name: Rename the pinned plugin marketplace
        run: |
          python3 -I -S -B -c '
          import json, sys
          path = sys.argv[1]
          data = json.load(open(path))
          assert data["name"] == "claude-code-plugins", data["name"]
          data["name"] = "may-pinned-claude-code"
          json.dump(data, open(path, "w"), indent=2)
          ' .claude-marketplace/claude-code/.claude-plugin/marketplace.json

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@1d6de8cb0c237e7c15e9e1bdf973826ebae490cc # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: ${{ github.workspace }}/.claude-marketplace/claude-code
          plugins: 'code-review@may-pinned-claude-code'
          prompt: '/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

