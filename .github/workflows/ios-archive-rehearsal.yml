name: May iOS archive rehearsal of a may-app pull request head (ios.sh archive-unsigned, ad hoc, nothing uploaded but a fixed summary)
on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Open May-Assistant/may-app pull request against main (not from a fork)
        required: true
        type: string
      source_sha:
        description: That pull request's current 40-character head commit
        required: true
        type: string
      target:
        description: App to archive (production needs equal iOS and Android design-system pins)
        required: true
        type: choice
        options: [playground, production]
      build_number:
        description: CFBundleVersion for the rehearsal, above may-app's committed iOS floor
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: may-ios-archive-rehearsal
  cancel-in-progress: false
jobs:
  admission:
    # Rehearsal of may-app's tools/release/ios.sh archive-unsigned on macos-15 with the pinned Xcode 26.3 (17C529),
    # at the head of an open may-app pull request, before the iOS store jobs are switched on. The same gate, fetch and
    # environment as native-compile-pr.yml (gate.py --action compile-pr: may-native-compile-pr, no required reviewer,
    # main only), because it holds the same things: two read-only deploy keys and a pull-request read token. No
    # signing, store call or comment. ios.sh's output, and its own build record, stay in a private log; only a
    # fixed-shape summary written by this repository (ios_rehearsal.py) is uploaded, never the archive.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      environment: ${{ steps.gate.outputs.environment }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          MAY_SOURCE_SHA: ${{ inputs.source_sha }}
          MAY_PR_NUMBER: ${{ inputs.pr_number }}
        run: python3 -I -S -B tools/may_release/gate.py --action compile-pr --source-sha "$MAY_SOURCE_SHA" --pr-number "$MAY_PR_NUMBER"
  rehearsal:
    needs: admission
    runs-on: macos-15
    environment: ${{ needs.admission.outputs.environment }}
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Mint the May CI token for MAY_APP_PR_READ_TOKEN, before any pull request code
        id: ci-read
        if: vars.MAY_CI_APP_ID != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.MAY_CI_APP_ID }}
          private-key: ${{ secrets.MAY_CI_APP_PRIVATE_KEY }}
          owner: May-Assistant
          repositories: may-app
          permission-pull-requests: read
      - name: Check the pull request head and environment before fetching
        env:
          GH_TOKEN: ${{ github.token }}
          MAY_APP_PR_READ_TOKEN: ${{ steps.ci-read.outputs.token || secrets.MAY_APP_PR_READ_TOKEN }}
          MAY_SOURCE_SHA: ${{ inputs.source_sha }}
          MAY_PR_NUMBER: ${{ inputs.pr_number }}
        run: python3 -I -S -B tools/may_release/gate.py --action compile-pr --source-sha "$MAY_SOURCE_SHA" --pr-number "$MAY_PR_NUMBER" --check-pull
      - name: Fetch the pull request head and pinned design system quietly
        env:
          MAY_SOURCE_SHA: ${{ inputs.source_sha }}
          MAY_PR_NUMBER: ${{ inputs.pr_number }}
          MAY_TARGET: ${{ inputs.target }}
          MAY_APP_READ_KEY: ${{ secrets.MAY_APP_READ_KEY }}
          MAY_DS_READ_KEY: ${{ secrets.MAY_DS_READ_KEY }}
        run: python3 -I -S -B tools/may_release/prepare.py --platform ios --target "$MAY_TARGET" --source-sha "$MAY_SOURCE_SHA" --pr-number "$MAY_PR_NUMBER"
      - name: Archive with ios.sh, unsigned, without any credential
        env:
          MAY_SOURCE_SHA: ${{ inputs.source_sha }}
          MAY_PR_NUMBER: ${{ inputs.pr_number }}
          MAY_TARGET: ${{ inputs.target }}
          MAY_BUILD_NUMBER: ${{ inputs.build_number }}
        run: python3 -I -S -B tools/may_release/ios_rehearsal.py archive --target "$MAY_TARGET" --source-sha "$MAY_SOURCE_SHA" --build-number "$MAY_BUILD_NUMBER" --pr-number "$MAY_PR_NUMBER"
      - name: Check the rehearsal summary before publishing it
        env:
          MAY_SOURCE_SHA: ${{ inputs.source_sha }}
          MAY_PR_NUMBER: ${{ inputs.pr_number }}
          MAY_TARGET: ${{ inputs.target }}
          MAY_BUILD_NUMBER: ${{ inputs.build_number }}
        run: python3 -I -S -B tools/may_release/ios_rehearsal.py record --target "$MAY_TARGET" --source-sha "$MAY_SOURCE_SHA" --build-number "$MAY_BUILD_NUMBER" --pr-number "$MAY_PR_NUMBER"
      - name: Publish only the rehearsal summary, never the archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: may-ios-archive-rehearsal-${{ github.run_attempt }}
          path: ${{ runner.temp }}/may-rehearsal/ios-archive-rehearsal.json
          if-no-files-found: error
          retention-days: 7
      - name: Fail unless ios.sh archived and every check passed
        env:
          MAY_SOURCE_SHA: ${{ inputs.source_sha }}
          MAY_PR_NUMBER: ${{ inputs.pr_number }}
          MAY_TARGET: ${{ inputs.target }}
          MAY_BUILD_NUMBER: ${{ inputs.build_number }}
        run: python3 -I -S -B tools/may_release/ios_rehearsal.py verdict --target "$MAY_TARGET" --source-sha "$MAY_SOURCE_SHA" --build-number "$MAY_BUILD_NUMBER" --pr-number "$MAY_PR_NUMBER"
      - name: Remove private source, logs, the archive and the summary
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/may-source" "$RUNNER_TEMP/may-design-system" "$RUNNER_TEMP/may-private" "$RUNNER_TEMP/may-release" "$RUNNER_TEMP/may-rehearsal" "$RUNNER_TEMP"/may-ios-build.*
