name: May Android renders of a may-app commit (Playground unit-test renders, published only to the private may-renders)
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: may-app commit to render (a main commit, or the current head of pr_number)
        required: true
        type: string
      pr_number:
        description: Open May-Assistant/may-app pull request whose head is source_sha (empty for a main commit)
        required: false
        type: string
        default: ""
permissions:
  contents: read
concurrency:
  group: may-android-renders
  cancel-in-progress: false
jobs:
  admission:
    # May Playground's Android renders: may-app's own unit tests named *Renders*, run with the pinned JDK 21 and
    # -Dmay.renders.dir (android_renders.py). The same admission and environment as the iOS renders (gate.py --action
    # renders: may-ios-renders, no required reviewer, main only), because it holds the same things. The render job holds
    # no secret beyond the two read-only deploy keys, which its fetch step alone binds and removes before may-app's code
    # runs; it prints counts and fixed words alone and hands over one age-encrypted file. The publish job, on a fresh
    # runner that runs no may-app code, decrypts it and pushes it to the private May-Assistant/may-renders under
    # android-renders/ (publish.py android-*). Nothing derived from may-app is printed, summarised or uploaded here in the
    # clear; the test filter is fixed in android_renders.py, never an input.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      environment: ${{ steps.gate.outputs.environment }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          MAY_SOURCE_SHA: ${{ inputs.source_sha }}
          MAY_PR_NUMBER: ${{ inputs.pr_number }}
        run: python3 -I -S -B tools/may_release/gate.py --action renders --source-sha "$MAY_SOURCE_SHA" ${MAY_PR_NUMBER:+--pr-number "$MAY_PR_NUMBER"}
  render:
    needs: admission
    runs-on: ubuntu-24.04
    environment: ${{ needs.admission.outputs.environment }}
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    outputs:
      attempt: ${{ github.run_attempt }}
      handed: ${{ steps.handover.outputs.artifact-id }}
      tests: ${{ steps.run.outputs.tests }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Mint the May CI token for MAY_APP_PR_READ_TOKEN, before any pull request code
        id: ci-read
        if: vars.MAY_CI_APP_ID != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.MAY_CI_APP_ID }}
          private-key: ${{ secrets.MAY_CI_APP_PRIVATE_KEY }}
          owner: May-Assistant
          repositories: may-app
          permission-pull-requests: read
      - name: Check the pull request head and environment before fetching
        if: inputs.pr_number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          MAY_APP_PR_READ_TOKEN: ${{ steps.ci-read.outputs.token || secrets.MAY_APP_PR_READ_TOKEN }}
          MAY_SOURCE_SHA: ${{ inputs.source_sha }}
          MAY_PR_NUMBER: ${{ inputs.pr_number }}
        run: python3 -I -S -B tools/may_release/gate.py --action renders --source-sha "$MAY_SOURCE_SHA" --pr-number "$MAY_PR_NUMBER" --check-pull
      - name: Install the pinned JDK
        run: python3 -I -S -B tools/may_release/toolchain.py jdk
      - name: Install pinned age
        run: python3 -I -S -B tools/may_release/toolchain.py age
      - name: Fetch the may-app commit and its design system quietly
        env:
          MAY_SOURCE_SHA: ${{ inputs.source_sha }}
          MAY_PR_NUMBER: ${{ inputs.pr_number }}
          MAY_APP_READ_KEY: ${{ secrets.MAY_APP_READ_KEY }}
          MAY_DS_READ_KEY: ${{ secrets.MAY_DS_READ_KEY }}
        run: python3 -I -S -B tools/may_release/prepare.py --platform android --target playground --source-sha "$MAY_SOURCE_SHA" ${MAY_PR_NUMBER:+--pr-number "$MAY_PR_NUMBER"}
      - name: Run the render tests without any credential
        id: run
        env:
          MAY_SOURCE_SHA: ${{ inputs.source_sha }}
        run: python3 -I -S -B tools/may_release/android_renders.py run --source-sha "$MAY_SOURCE_SHA"
      - name: Encrypt the run folder to the renders public key
        env:
          MAY_SOURCE_SHA: ${{ inputs.source_sha }}
          MAY_RENDERS_RECIPIENT: ${{ vars.MAY_RENDERS_RECIPIENT }}
        run: python3 -I -S -B tools/may_release/android_renders.py seal --source-sha "$MAY_SOURCE_SHA"
      - name: Hand over only the encrypted renders
        id: handover
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: may-android-renders-${{ github.run_attempt }}
          path: ${{ runner.temp }}/may-renders-sealed/renders.age
          if-no-files-found: ignore
          retention-days: 1
      - name: Fail unless the render tests passed and made renders
        env:
          MAY_SOURCE_SHA: ${{ inputs.source_sha }}
        run: python3 -I -S -B tools/may_release/android_renders.py verdict --source-sha "$MAY_SOURCE_SHA"
      - name: Remove private source, logs, renders and products
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/may-source" "$RUNNER_TEMP/may-design-system" "$RUNNER_TEMP/may-private" "$RUNNER_TEMP/may-gradle" "$RUNNER_TEMP/may-tools" "$RUNNER_TEMP/may-android-renders-snapshots" "$RUNNER_TEMP/may-android-renders-out" "$RUNNER_TEMP/may-renders-sealed"
  publish:
    # A fresh runner that runs no may-app code: the decrypt key, the may-renders write key and the comment token each live
    # in one step of this job alone. It publishes whatever the render job sealed, even when that job then failed its
    # verdict, so the renders that were made can be seen.
    needs: [admission, render]
    if: ${{ !cancelled() && needs.admission.result == 'success' }}
    runs-on: ubuntu-24.04
    environment: ${{ needs.admission.outputs.environment }}
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Mint the May CI token for MAY_APP_PR_COMMENT_TOKEN, before any pull request code
        id: ci-comment
        if: vars.MAY_CI_APP_ID != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.MAY_CI_APP_ID }}
          private-key: ${{ secrets.MAY_CI_APP_PRIVATE_KEY }}
          owner: May-Assistant
          repositories: may-app
          permission-pull-requests: write
      - name: Install pinned age
        run: python3 -I -S -B tools/may_release/toolchain.py age
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        # Nothing to download (the key still a placeholder, or the render job stopped first) is reported by the next step.
        continue-on-error: true
        with:
          name: may-android-renders-${{ needs.render.outputs.attempt }}
          path: ${{ runner.temp }}/may-renders-download
      - name: Decrypt and check the renders
        env:
          MAY_SOURCE_SHA: ${{ inputs.source_sha }}
          MAY_RENDERS_RECIPIENT: ${{ vars.MAY_RENDERS_RECIPIENT }}
          MAY_RENDERS_DECRYPT_KEY: ${{ secrets.MAY_RENDERS_DECRYPT_KEY }}
          MAY_RENDERS_HANDED: ${{ needs.render.outputs.handed }}
        run: python3 -I -S -B tools/may_release/publish.py android-open --source-sha "$MAY_SOURCE_SHA"
      - name: Push the run folder to may-renders
        env:
          MAY_SOURCE_SHA: ${{ inputs.source_sha }}
          MAY_PR_NUMBER: ${{ inputs.pr_number }}
          MAY_APP_RENDERS_WRITE_KEY: ${{ secrets.MAY_APP_RENDERS_WRITE_KEY }}
        run: python3 -I -S -B tools/may_release/publish.py android-push --source-sha "$MAY_SOURCE_SHA" ${MAY_PR_NUMBER:+--pr-number "$MAY_PR_NUMBER"}
      - name: Link the renders on the may-app pull request
        env:
          MAY_SOURCE_SHA: ${{ inputs.source_sha }}
          MAY_PR_NUMBER: ${{ inputs.pr_number }}
          MAY_RENDERS_TESTS: ${{ needs.render.outputs.tests }}
          MAY_APP_PR_COMMENT_TOKEN: ${{ steps.ci-comment.outputs.token || secrets.MAY_APP_PR_COMMENT_TOKEN }}
          MAY_CI_APP_SLUG: ${{ steps.ci-comment.outputs.app-slug }}
        run: python3 -I -S -B tools/may_release/publish.py android-comment --source-sha "$MAY_SOURCE_SHA" ${MAY_PR_NUMBER:+--pr-number "$MAY_PR_NUMBER"}
      - name: Remove the decrypted renders and the branch checkout
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/may-private" "$RUNNER_TEMP/may-renders-download" "$RUNNER_TEMP/may-publish-tree" "$RUNNER_TEMP/may-publish-git"
