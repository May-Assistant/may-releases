name: May device tests (Playground on an emulator against staging; reports only to the private may-renders)
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: may-app commit in main history to test (empty for main's head)
        required: false
        type: string
        default: ""
      scenarios:
        description: Scenario ids from device_scenarios.json, comma-separated, or all
        required: false
        type: string
        default: all
      ios_reduce_motion:
        description: Turn on Reduce Motion in the iOS simulator before the app starts (to compare iOS runs with and without it)
        required: false
        type: boolean
        default: false
      ios_diagnostics:
        description: Ask the iOS app for its main-thread watchdog and SwiftUI change log (evidence runs only; off, stalls are not collected)
        required: false
        type: boolean
        default: false
      tidy_file_taxes:
        description: One-off, instead of the scenarios - remove earlier runs' leftover note lines from the test account's "file taxes" task
        required: false
        type: boolean
        default: false
      backfill_test_items:
        description: One-off, instead of the scenarios - the earlier device-test runs' test-session cleanup on the shared account (dry counts only; real needs backfill_expect)
        required: false
        type: choice
        options:
          - none
          - dry
          - real
        default: none
      backfill_expect:
        description: For real alone - the totals line of the approved dry run, exactly as its log printed it
        required: false
        type: string
        default: ""
  schedule:
    - cron: "17 3 * * *"
permissions:
  contents: read
concurrency:
  group: may-device-tests
  cancel-in-progress: false
jobs:
  admission:
    # May Playground on an Android emulator against live staging, signed in as the staging test account through a
    # short-lived session (POST /v1/auth/test-session, MAY_TEST_SIGNIN_SECRET), driven by may-app's Maestro flows and
    # by an agent: the pinned Claude Code with the repository's CLAUDE_CODE_OAUTH_TOKEN (in the scenarios and judge
    # steps alone), the model from MAY_DEVICE_TESTS_MODEL, and the emulator as its only tools (device_mcp.py).
    # Environment may-device-tests: main only, no required reviewer (the nightly run cannot wait for one). Trust: v1
    # tests may-app main commits alone (prepare.py checks main history; the nightly run takes main's head), never a
    # pull request, because the run step holds the sign-in secret. This repository is public and may-app private:
    # the log carries scenario ids, verdict words and counts; screenshots, recordings and reports leave the runner
    # only age-encrypted, and the publish job, on a fresh runner that runs no may-app code, decrypts them and
    # pushes them to the private May-Assistant/may-renders (publish.py device-open, device-push).
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      environment: ${{ steps.gate.outputs.environment }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          MAY_SOURCE_SHA: ${{ inputs.source_sha || 'main' }}
        run: python3 -I -S -B tools/may_release/gate.py --action device-tests --source-sha "$MAY_SOURCE_SHA"
  tidy:
    # The one-off clean-up (tidy_file_taxes): a shared-account test session, earlier notes runs' leftover lines removed
    # from its "file taxes" task, the session signed out (device_tests.py tidy). No may-app code and no device: the
    # secret is in this one step's environment, and the log carries counts alone.
    needs: admission
    if: ${{ inputs.tidy_file_taxes }}
    runs-on: ubuntu-24.04
    environment: ${{ needs.admission.outputs.environment }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Remove the leftover note lines from the test account's file taxes task
        env:
          MAY_TEST_SIGNIN_SECRET: ${{ secrets.MAY_TEST_SIGNIN_SECRET }}
          MAY_STAGING_API_URL: ${{ vars.MAY_STAGING_API_URL }}
        run: python3 -I -S -B tools/may_release/device_tests.py tidy
  backfill:
    # The one-off backfill (backfill_test_items, coordinator, 28 Oct): a shared-account test session runs the test-session
    # cleanup once for each earlier device-test run's tag (device_tests.BACKFILL_RUNS, fixed in the code), dry first;
    # real runs only when the same job's dry totals equal backfill_expect. No may-app code and no device: the secret is
    # in this one step's environment, and the log carries totals alone.
    needs: admission
    if: ${{ inputs.backfill_test_items == 'dry' || inputs.backfill_test_items == 'real' }}
    runs-on: ubuntu-24.04
    environment: ${{ needs.admission.outputs.environment }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Run the earlier runs' test-session cleanup on the shared test account
        env:
          MAY_TEST_SIGNIN_SECRET: ${{ secrets.MAY_TEST_SIGNIN_SECRET }}
          MAY_STAGING_API_URL: ${{ vars.MAY_STAGING_API_URL }}
          MAY_BACKFILL_MODE: ${{ inputs.backfill_test_items }}
          MAY_BACKFILL_EXPECT: ${{ inputs.backfill_expect }}
        run: python3 -I -S -B tools/may_release/device_tests.py backfill
  android:
    needs: admission
    if: ${{ !inputs.tidy_file_taxes && inputs.backfill_test_items != 'dry' && inputs.backfill_test_items != 'real' }}
    runs-on: ubuntu-24.04
    environment: ${{ needs.admission.outputs.environment }}
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install pinned age
        run: python3 -I -S -B tools/may_release/toolchain.py age
      - name: Fetch the may-app commit and its design system quietly
        env:
          MAY_SOURCE_SHA: ${{ inputs.source_sha || 'main' }}
          MAY_APP_READ_KEY: ${{ secrets.MAY_APP_READ_KEY }}
          MAY_DS_READ_KEY: ${{ secrets.MAY_DS_READ_KEY }}
        run: python3 -I -S -B tools/may_release/prepare.py --platform android --target playground --source-sha "$MAY_SOURCE_SHA"
      - name: Build May Playground for the emulator without secrets
        run: python3 -I -S -B tools/may_release/device_tests.py build
      - name: Let the emulator use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules > /dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run the scenarios against staging and record them
        env:
          MAY_SCENARIOS: ${{ inputs.scenarios || 'all' }}
          MAY_TEST_SIGNIN_SECRET: ${{ secrets.MAY_TEST_SIGNIN_SECRET }}
          MAY_STAGING_API_URL: ${{ vars.MAY_STAGING_API_URL }}
          MAY_DEVICE_TESTS_OUTWARD: ${{ vars.MAY_DEVICE_TESTS_OUTWARD }}
          MAY_DEVICE_TESTS_SKIP: ${{ vars.MAY_DEVICE_TESTS_SKIP }}
          MAY_DEVICE_TESTS_FRESH: ${{ vars.MAY_DEVICE_TESTS_FRESH }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          MAY_DEVICE_TESTS_MODEL: ${{ vars.MAY_DEVICE_TESTS_MODEL }}
        run: python3 -I -S -B tools/may_release/device_tests.py run --scenarios "$MAY_SCENARIOS"
      - name: Judge the agent scenarios
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          MAY_DEVICE_TESTS_MODEL: ${{ vars.MAY_DEVICE_TESTS_MODEL }}
        run: python3 -I -S -B tools/may_release/device_tests.py judge
      - name: Make a 270px preview of each recording, with no secret
        # Optional and bounded: the seal and the handover always run after it.
        continue-on-error: true
        timeout-minutes: 8
        run: python3 -I -S -B tools/may_release/device_tests.py previews
      - name: Render the flow prototypes' expected screens, with no secret and no network
        # Optional and bounded: may-app's stdlib build of this commit's prototypes and the image's Chrome, run as a
        # user of their own with no network; the seal and the handover always run after it.
        continue-on-error: true
        timeout-minutes: 8
        run: python3 -I -S -B tools/may_release/device_tests.py prototypes
      - name: Encrypt the report to the renders public key
        env:
          MAY_RENDERS_RECIPIENT: ${{ vars.MAY_RENDERS_RECIPIENT }}
        run: python3 -I -S -B tools/may_release/device_tests.py seal
      - name: Hand over only the encrypted report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: may-device-android-${{ github.run_attempt }}
          path: ${{ runner.temp }}/may-device-sealed/android.age
          if-no-files-found: ignore
          retention-days: 7
      - name: Fail if any scenario failed
        run: python3 -I -S -B tools/may_release/device_tests.py verdict
      - name: Remove private source, logs, recordings and products
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/may-source" "$RUNNER_TEMP/may-design-system" "$RUNNER_TEMP/may-private" "$RUNNER_TEMP/may-gradle" "$RUNNER_TEMP/may-avd" "$RUNNER_TEMP/may-maestro" "$RUNNER_TEMP/may-claude" "$RUNNER_TEMP/may-device-out" "$RUNNER_TEMP/may-device-sealed"
  ios:
    # The same scenarios on an iPhone 16 Pro simulator (device_ios.py): May Playground built as ios-renders builds it,
    # the test session handed over in SIMCTL_CHILD_MAY_TEST_SESSION, the agent acting through Maestro's driver. The
    # Claude token is in its scenarios and judge steps alone, as on Android.
    needs: admission
    if: ${{ !inputs.tidy_file_taxes && inputs.backfill_test_items != 'dry' && inputs.backfill_test_items != 'real' }}
    runs-on: macos-15
    environment: ${{ needs.admission.outputs.environment }}
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install pinned age
        run: python3 -I -S -B tools/may_release/toolchain.py age
      - name: Fetch the may-app commit and its design system quietly
        env:
          MAY_SOURCE_SHA: ${{ inputs.source_sha || 'main' }}
          MAY_APP_READ_KEY: ${{ secrets.MAY_APP_READ_KEY }}
          MAY_DS_READ_KEY: ${{ secrets.MAY_DS_READ_KEY }}
        run: python3 -I -S -B tools/may_release/prepare.py --platform ios --target playground --source-sha "$MAY_SOURCE_SHA"
      - name: Build May Playground for the simulator without secrets
        run: python3 -I -S -B tools/may_release/device_tests.py build --platform ios
      - name: Run the scenarios against staging and record them
        env:
          MAY_SCENARIOS: ${{ inputs.scenarios || 'all' }}
          MAY_TEST_SIGNIN_SECRET: ${{ secrets.MAY_TEST_SIGNIN_SECRET }}
          MAY_STAGING_API_URL: ${{ vars.MAY_STAGING_API_URL }}
          MAY_DEVICE_TESTS_OUTWARD: ${{ vars.MAY_DEVICE_TESTS_OUTWARD }}
          MAY_DEVICE_TESTS_SKIP: ${{ vars.MAY_DEVICE_TESTS_SKIP }}
          MAY_DEVICE_TESTS_FRESH: ${{ vars.MAY_DEVICE_TESTS_FRESH }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          MAY_DEVICE_TESTS_MODEL: ${{ vars.MAY_DEVICE_TESTS_MODEL }}
          MAY_IOS_REDUCE_MOTION: ${{ inputs.ios_reduce_motion }}
          MAY_IOS_DIAGNOSTICS: ${{ inputs.ios_diagnostics }}
        run: python3 -I -S -B tools/may_release/device_tests.py run --platform ios --scenarios "$MAY_SCENARIOS"
      - name: Judge the agent scenarios
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          MAY_DEVICE_TESTS_MODEL: ${{ vars.MAY_DEVICE_TESTS_MODEL }}
        run: python3 -I -S -B tools/may_release/device_tests.py judge --platform ios
      - name: Make a 270px preview of each recording, with no secret
        # Optional and bounded: the seal and the handover always run after it.
        continue-on-error: true
        timeout-minutes: 8
        run: python3 -I -S -B tools/may_release/device_tests.py previews --platform ios
      - name: Encrypt the report to the renders public key
        env:
          MAY_RENDERS_RECIPIENT: ${{ vars.MAY_RENDERS_RECIPIENT }}
        run: python3 -I -S -B tools/may_release/device_tests.py seal --platform ios
      - name: Hand over only the encrypted report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: may-device-ios-${{ github.run_attempt }}
          path: ${{ runner.temp }}/may-device-sealed/ios.age
          if-no-files-found: ignore
          retention-days: 7
      - name: Fail if any scenario failed
        run: python3 -I -S -B tools/may_release/device_tests.py verdict --platform ios
      - name: Remove private source, logs, recordings and products
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/may-source" "$RUNNER_TEMP/may-design-system" "$RUNNER_TEMP/may-private" "$RUNNER_TEMP/may-derived" "$RUNNER_TEMP/may-packages" "$RUNNER_TEMP/may-maestro" "$RUNNER_TEMP/may-claude" "$RUNNER_TEMP/may-device-out" "$RUNNER_TEMP/may-device-sealed"
  publish:
    # A fresh runner that runs no may-app code: the decrypt key, the may-renders write key and its release token each
    # live in one step. Recordings never enter may-renders' git history: they are assets of the run's release.
    # It publishes whatever the device jobs sealed, even when one then failed its verdict.
    needs: [admission, android, ios]
    if: ${{ !cancelled() && needs.admission.result == 'success' && !inputs.tidy_file_taxes && inputs.backfill_test_items != 'dry' && inputs.backfill_test_items != 'real' }}
    runs-on: ubuntu-24.04
    environment: ${{ needs.admission.outputs.environment }}
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Mint the May Renders token for MAY_RENDERS_RELEASE_TOKEN, before any pull request code
        id: renders-release
        if: vars.MAY_RENDERS_APP_ID != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.MAY_RENDERS_APP_ID }}
          private-key: ${{ secrets.MAY_RENDERS_APP_PRIVATE_KEY }}
          owner: May-Assistant
          repositories: may-renders
          permission-contents: write
      - name: Install pinned age
        run: python3 -I -S -B tools/may_release/toolchain.py age
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        # Nothing to download (no recipient yet, or the device job stopped first) is reported by the next step.
        continue-on-error: true
        with:
          name: may-device-android-${{ github.run_attempt }}
          path: ${{ runner.temp }}/may-device-download
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        continue-on-error: true
        with:
          name: may-device-ios-${{ github.run_attempt }}
          path: ${{ runner.temp }}/may-device-download
      - name: Decrypt and check the reports
        env:
          MAY_RENDERS_RECIPIENT: ${{ vars.MAY_RENDERS_RECIPIENT }}
          MAY_RENDERS_DECRYPT_KEY: ${{ secrets.MAY_RENDERS_DECRYPT_KEY }}
        run: python3 -I -S -B tools/may_release/publish.py device-open
      - name: Push the run folder to may-renders
        env:
          MAY_APP_RENDERS_WRITE_KEY: ${{ secrets.MAY_APP_RENDERS_WRITE_KEY }}
        run: python3 -I -S -B tools/may_release/publish.py device-push
      - name: Upload the recordings as may-renders release assets
        env:
          MAY_RENDERS_RELEASE_TOKEN: ${{ steps.renders-release.outputs.token || secrets.MAY_RENDERS_RELEASE_TOKEN }}
        run: python3 -I -S -B tools/may_release/publish.py device-release
      - name: Remove the decrypted reports and the branch checkout
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/may-private" "$RUNNER_TEMP/may-device-download" "$RUNNER_TEMP/may-publish-tree" "$RUNNER_TEMP/may-publish-git"
