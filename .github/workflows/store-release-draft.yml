name: May protected store release (stage 1, Android dry runs only)
# Activation stage 1: an Android dry run can be dispatched. Store uploads (both
# platforms) and every iOS job are still inert: they require an event name this
# workflow never registers, so they are always skipped. Stage 2 is a separate
# reviewed change that removes that guard from the Android upload step, after a
# successful Android dry run and Samuel's go. static_check.py pins exactly where
# the guard must and must not be for this stage.
# Each run is two jobs on separate fresh VMs:
#   *-build    environment may-native-compile (read-only source keys only). Runs
#              the private build (Gradle / Xcode / SwiftPM: third-party code) and
#              encrypts the unsigned product to the target's committed age key.
#   *-release  the target's store environment. Runs no build toolchain: only this
#              repository's Python, checksum-verified Temurin jarsigner and age,
#              and Apple's tools. Decrypts, signs, verifies and uploads.
# Store environments, chosen by gate.py and never auto-created (a missing one is
# a 404 and admission denies):
#   android/production -> may-android-internal             (May, Play 4974275831988601568)
#   android/playground -> may-android-playground-internal  (May Playground, Play 4972137188420176977)
#   ios/production     -> may-ios-internal                 (May, ASC 6821782401)
#   ios/playground     -> may-ios-playground-internal      (May Playground, ASC 6822072535)
# dry_run (default true) runs build, seal, open, sign and verify, skips every store
# upload step, and reports what it would have uploaded. A real upload will need
# dry_run: false, chosen explicitly at dispatch, once stage 2 lands. In stage 1,
# dry_run: false fails by design: admission (gate.py --dry-run, UPLOADS_HELD)
# refuses it before any approval, build or secret.
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Store platform
        required: true
        type: choice
        options: [ios, android]
      target:
        description: Separate May or May Playground store app
        required: true
        type: choice
        options: [production, playground]
      source_sha:
        description: Reviewed 40-character May app commit in main history
        required: true
        type: string
      build_number:
        description: Unused positive build number for this app
        required: true
        type: string
      dry_run:
        description: Sign and verify, but skip every store upload and report what it would have uploaded
        required: true
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: may-store-release
  cancel-in-progress: false
jobs:
  admission:
    # Active (stage 1). Runs for every dispatch and checks both environments the
    # run will use; an iOS dispatch then stops here, because the iOS jobs are inert.
    # It also refuses dry_run: false while that platform's uploads are held.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      environment: ${{ steps.gate.outputs.environment }}
      build_environment: ${{ steps.gate.outputs.build_environment }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          MAY_PLATFORM: ${{ inputs.platform }}
          MAY_TARGET: ${{ inputs.target }}
          MAY_SOURCE_SHA: ${{ inputs.source_sha }}
          MAY_BUILD_NUMBER: ${{ inputs.build_number }}
          MAY_DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: python3 -I -S -B tools/may_release/gate.py --action "$MAY_PLATFORM" --target "$MAY_TARGET" --source-sha "$MAY_SOURCE_SHA" --build-number "$MAY_BUILD_NUMBER" --dry-run "$MAY_DRY_RUN"
  android-build:
    needs: admission
    if: ${{ inputs.platform == 'android' }}
    runs-on: ubuntu-24.04
    environment: ${{ needs.admission.outputs.build_environment }}
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      MAY_TARGET: ${{ inputs.target }}
      MAY_SOURCE_SHA: ${{ inputs.source_sha }}
      MAY_BUILD_NUMBER: ${{ inputs.build_number }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Recheck build environment after Samuel's review
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -I -S -B tools/may_release/gate.py --action compile --source-sha "$MAY_SOURCE_SHA"
      - name: Install pinned JDK and age
        run: |
          python3 -I -S -B tools/may_release/toolchain.py jdk --export
          python3 -I -S -B tools/may_release/toolchain.py age
      - name: Fetch exact private source and pinned design system
        env:
          MAY_APP_READ_KEY: ${{ secrets.MAY_APP_READ_KEY }}
          MAY_DS_READ_KEY: ${{ secrets.MAY_DS_READ_KEY }}
        run: python3 -I -S -B tools/may_release/prepare.py --platform android --target "$MAY_TARGET" --source-sha "$MAY_SOURCE_SHA"
      - name: Build unsigned Android App Bundle without secrets
        run: python3 -I -S -B tools/may_release/store.py --platform android --target "$MAY_TARGET" --source-sha "$MAY_SOURCE_SHA" --build-number "$MAY_BUILD_NUMBER"
      - name: Encrypt unsigned bundle to the target's public key
        run: python3 -I -S -B tools/may_release/handoff.py seal --platform android --target "$MAY_TARGET" --source-sha "$MAY_SOURCE_SHA" --build-number "$MAY_BUILD_NUMBER"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: may-handoff-android-${{ github.run_attempt }}
          path: ${{ runner.temp }}/may-handoff/handoff.age
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
      - name: Remove task-owned private source and build output
        if: always()
        run: python3 -I -S -B tools/may_release/cleanup.py build
  android-release:
    needs: [admission, android-build]
    if: ${{ inputs.platform == 'android' }}
    runs-on: ubuntu-24.04
    environment: ${{ needs.admission.outputs.environment }}
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      MAY_TARGET: ${{ inputs.target }}
      MAY_SOURCE_SHA: ${{ inputs.source_sha }}
      MAY_BUILD_NUMBER: ${{ inputs.build_number }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Recheck protected destination after Samuel's review
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -I -S -B tools/may_release/gate.py --action android --target "$MAY_TARGET" --source-sha "$MAY_SOURCE_SHA" --build-number "$MAY_BUILD_NUMBER"
      - name: Install pinned JDK and age
        run: |
          python3 -I -S -B tools/may_release/toolchain.py jdk
          python3 -I -S -B tools/may_release/toolchain.py age
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        # A missing artifact (another attempt's build) is reported by the decrypt step.
        continue-on-error: true
        with:
          name: may-handoff-android-${{ github.run_attempt }}
          path: ${{ runner.temp }}/may-handoff-download
      - name: Check the checkout is exactly its commit before decrypting
        run: python3 -I -S -B tools/may_release/integrity.py
      - name: Decrypt and check the build handoff
        env:
          MAY_ARTIFACT_DECRYPT_KEY: ${{ secrets.MAY_ARTIFACT_DECRYPT_KEY }}
        run: python3 -I -S -B tools/may_release/handoff.py open --platform android --target "$MAY_TARGET" --source-sha "$MAY_SOURCE_SHA" --build-number "$MAY_BUILD_NUMBER"
      - name: Check the checkout is exactly its commit before signing
        run: python3 -I -S -B tools/may_release/integrity.py
      - name: Sign and verify Android App Bundle
        env:
          MAY_ANDROID_KEYSTORE_BASE64: ${{ secrets.MAY_ANDROID_KEYSTORE_BASE64 }}
          MAY_ANDROID_STORE_PASSWORD: ${{ secrets.MAY_ANDROID_STORE_PASSWORD }}
          MAY_ANDROID_KEY_PASSWORD: ${{ secrets.MAY_ANDROID_KEY_PASSWORD }}
          MAY_ANDROID_KEY_ALIAS: ${{ vars.MAY_ANDROID_KEY_ALIAS }}
          MAY_ANDROID_CERT_SHA256: ${{ vars.MAY_ANDROID_CERT_SHA256 }}
        run: python3 -I -S -B tools/may_release/sign.py --platform android --target "$MAY_TARGET" --source-sha "$MAY_SOURCE_SHA" --build-number "$MAY_BUILD_NUMBER"
      - name: Check the checkout is exactly its commit before uploading
        run: python3 -I -S -B tools/may_release/integrity.py
      - name: Upload update to the internal track only
        # Stage 1: held inert by the never-matching event guard, so this never runs,
        # even when dry_run is false. Stage 2 removes only that guard, leaving the
        # dry-run condition: github.event.inputs holds the boolean as a string, and
        # == ignores case, so it runs on any casing of 'false'; a missing value
        # never does. The script then refuses everything but the exact string false.
        if: ${{ github.event_name == 'may-store-disabled-pending-review' && github.event.inputs.dry_run == 'false' }}
        env:
          MAY_DRY_RUN: ${{ github.event.inputs.dry_run }}
          MAY_PLAY_JSON: ${{ secrets.MAY_PLAY_JSON }}
          MAY_PLAY_ACCOUNT: ${{ vars.MAY_PLAY_ACCOUNT }}
        run: python3 -I -S -B tools/may_release/play_upload.py --target "$MAY_TARGET" --source-sha "$MAY_SOURCE_SHA" --build-number "$MAY_BUILD_NUMBER"
      - name: Report what the dry run would have uploaded
        if: ${{ github.event.inputs.dry_run != 'false' }}
        run: python3 -I -S -B tools/may_release/dry_run.py --platform android --target "$MAY_TARGET" --source-sha "$MAY_SOURCE_SHA" --build-number "$MAY_BUILD_NUMBER"
      - name: Remove task-owned bundle, keys and logs
        if: always()
        run: python3 -I -S -B tools/may_release/cleanup.py release
  ios-build:
    # Inert in stage 1: tools/release/ios.sh does not exist in may-app yet.
    needs: admission
    if: ${{ github.event_name == 'may-store-disabled-pending-review' && inputs.platform == 'ios' }}
    runs-on: macos-15
    environment: ${{ needs.admission.outputs.build_environment }}
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      MAY_TARGET: ${{ inputs.target }}
      MAY_SOURCE_SHA: ${{ inputs.source_sha }}
      MAY_BUILD_NUMBER: ${{ inputs.build_number }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Recheck build environment after Samuel's review
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -I -S -B tools/may_release/gate.py --action compile --source-sha "$MAY_SOURCE_SHA"
      - name: Install pinned age
        run: python3 -I -S -B tools/may_release/toolchain.py age
      - name: Fetch exact private source and pinned design system
        env:
          MAY_APP_READ_KEY: ${{ secrets.MAY_APP_READ_KEY }}
          MAY_DS_READ_KEY: ${{ secrets.MAY_DS_READ_KEY }}
        run: python3 -I -S -B tools/may_release/prepare.py --platform ios --target "$MAY_TARGET" --source-sha "$MAY_SOURCE_SHA"
      - name: Build unsigned iOS archive without secrets
        run: python3 -I -S -B tools/may_release/store.py --platform ios --target "$MAY_TARGET" --source-sha "$MAY_SOURCE_SHA" --build-number "$MAY_BUILD_NUMBER"
      - name: Encrypt unsigned archive to the target's public key
        run: python3 -I -S -B tools/may_release/handoff.py seal --platform ios --target "$MAY_TARGET" --source-sha "$MAY_SOURCE_SHA" --build-number "$MAY_BUILD_NUMBER"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: may-handoff-ios-${{ github.run_attempt }}
          path: ${{ runner.temp }}/may-handoff/handoff.age
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
      - name: Remove task-owned private source and build output
        if: always()
        run: python3 -I -S -B tools/may_release/cleanup.py build
  ios-release:
    # Inert in stage 1, like ios-build.
    needs: [admission, ios-build]
    if: ${{ github.event_name == 'may-store-disabled-pending-review' && inputs.platform == 'ios' }}
    runs-on: macos-15
    environment: ${{ needs.admission.outputs.environment }}
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      MAY_TARGET: ${{ inputs.target }}
      MAY_SOURCE_SHA: ${{ inputs.source_sha }}
      MAY_BUILD_NUMBER: ${{ inputs.build_number }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Recheck protected destination after Samuel's review
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -I -S -B tools/may_release/gate.py --action ios --target "$MAY_TARGET" --source-sha "$MAY_SOURCE_SHA" --build-number "$MAY_BUILD_NUMBER"
      - name: Install pinned age
        run: python3 -I -S -B tools/may_release/toolchain.py age
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        # A missing artifact (another attempt's build) is reported by the decrypt step.
        continue-on-error: true
        with:
          name: may-handoff-ios-${{ github.run_attempt }}
          path: ${{ runner.temp }}/may-handoff-download
      - name: Check the checkout is exactly its commit before decrypting
        run: python3 -I -S -B tools/may_release/integrity.py
      - name: Decrypt and check the build handoff
        env:
          MAY_ARTIFACT_DECRYPT_KEY: ${{ secrets.MAY_ARTIFACT_DECRYPT_KEY }}
        run: python3 -I -S -B tools/may_release/handoff.py open --platform ios --target "$MAY_TARGET" --source-sha "$MAY_SOURCE_SHA" --build-number "$MAY_BUILD_NUMBER"
      - name: Check the checkout is exactly its commit before signing
        run: python3 -I -S -B tools/may_release/integrity.py
      - name: Sign and verify internal-TestFlight IPA
        env:
          MAY_IOS_CERT_BASE64: ${{ secrets.MAY_IOS_CERT_BASE64 }}
          MAY_IOS_CERT_PASSWORD: ${{ secrets.MAY_IOS_CERT_PASSWORD }}
          MAY_IOS_PROFILE_BASE64: ${{ secrets.MAY_IOS_PROFILE_BASE64 }}
        run: python3 -I -S -B tools/may_release/sign.py --platform ios --target "$MAY_TARGET" --source-sha "$MAY_SOURCE_SHA" --build-number "$MAY_BUILD_NUMBER"
      - name: Check the checkout is exactly its commit before uploading
        run: python3 -I -S -B tools/may_release/integrity.py
      - name: Upload verified IPA for internal TestFlight
        # Held inert by the never-matching event guard (as is this whole job), so it
        # never runs. Once the guard is removed, the dry-run condition remains:
        # github.event.inputs holds the boolean as a string, and == ignores case,
        # so it runs on any casing of 'false'; a missing value never does. The
        # script then refuses everything but the exact string false.
        if: ${{ github.event_name == 'may-store-disabled-pending-review' && github.event.inputs.dry_run == 'false' }}
        env:
          MAY_DRY_RUN: ${{ github.event.inputs.dry_run }}
          MAY_ASC_KEY_BASE64: ${{ secrets.MAY_ASC_KEY_BASE64 }}
          MAY_ASC_KEY_ID: ${{ vars.MAY_ASC_KEY_ID }}
          MAY_ASC_ISSUER_ID: ${{ secrets.MAY_ASC_ISSUER_ID }}
        run: python3 -I -S -B tools/may_release/ios_upload.py --target "$MAY_TARGET" --source-sha "$MAY_SOURCE_SHA" --build-number "$MAY_BUILD_NUMBER"
      - name: Report what the dry run would have uploaded
        if: ${{ github.event.inputs.dry_run != 'false' }}
        run: python3 -I -S -B tools/may_release/dry_run.py --platform ios --target "$MAY_TARGET" --source-sha "$MAY_SOURCE_SHA" --build-number "$MAY_BUILD_NUMBER"
      - name: Remove task-owned archive, keys and logs
        if: always()
        run: python3 -I -S -B tools/may_release/cleanup.py release
