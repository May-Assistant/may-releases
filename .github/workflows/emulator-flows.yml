name: May emulator flows (Playground, pass/fail only)
# Builds May Playground at an exact may-app commit and runs may-app's scripted flows
# (android/flows, at flows_sha) on an Android emulator on a free public runner.
# Public output is pass or fail per flow test and nothing else: every tool writes to
# a private runner log that is never published, and no screenshot is kept.
# Environment may-flows: no required reviewer, admitted branches main and
# claude/emulator-flows only, holding read-only deploy keys for may-app and
# may-design-system (MAY_FLOWS_APP_READ_KEY, MAY_FLOWS_DS_READ_KEY). It holds no
# signing, store or handoff secret. A run from any other branch fails closed.
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: May app commit in main history to build and test (40 hex)
        required: true
        type: string
      flows_sha:
        description: May app commit whose android/flows to run (40 hex; may be a branch commit)
        required: true
        type: string
      flows:
        description: Which flows to run
        required: true
        type: choice
        default: all
        options: [all, chat-reply, task-detail, connections, empty-states]
permissions:
  contents: read
concurrency:
  group: may-emulator-flows
  cancel-in-progress: false
jobs:
  admission:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Admit only this workflow's own dispatch from an allowed branch
        env:
          MAY_SOURCE_SHA: ${{ inputs.source_sha }}
          MAY_FLOWS_SHA: ${{ inputs.flows_sha }}
          MAY_FLOWS: ${{ inputs.flows }}
        run: python3 -I -S -B tools/may_release/flows.py admit --source-sha "$MAY_SOURCE_SHA" --flows-sha "$MAY_FLOWS_SHA" --flows "$MAY_FLOWS"
  flows:
    needs: admission
    runs-on: ubuntu-24.04
    environment: may-flows
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      MAY_SOURCE_SHA: ${{ inputs.source_sha }}
      MAY_FLOWS_SHA: ${{ inputs.flows_sha }}
      MAY_FLOWS: ${{ inputs.flows }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install pinned JDK
        run: python3 -I -S -B tools/may_release/toolchain.py jdk --export
      - name: Fetch exact private source and pinned design system
        env:
          MAY_APP_READ_KEY: ${{ secrets.MAY_FLOWS_APP_READ_KEY }}
          MAY_DS_READ_KEY: ${{ secrets.MAY_FLOWS_DS_READ_KEY }}
        run: python3 -I -S -B tools/may_release/prepare.py --platform android --target playground --source-sha "$MAY_SOURCE_SHA"
      - name: Place the flows over the prepared source
        env:
          MAY_APP_READ_KEY: ${{ secrets.MAY_FLOWS_APP_READ_KEY }}
        run: python3 -I -S -B tools/may_release/flows.py overlay --source-sha "$MAY_SOURCE_SHA" --flows-sha "$MAY_FLOWS_SHA"
      - name: Build May Playground and its flows without secrets
        run: python3 -I -S -B tools/may_release/flows.py build --source-sha "$MAY_SOURCE_SHA"
      - name: Let the emulator use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules > /dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run the flows on an emulator and report pass or fail
        run: python3 -I -S -B tools/may_release/flows.py run --source-sha "$MAY_SOURCE_SHA" --flows "$MAY_FLOWS"
      - name: Remove private source, logs and products
        if: always()
        run: python3 -I -S -B tools/may_release/flows.py cleanup
