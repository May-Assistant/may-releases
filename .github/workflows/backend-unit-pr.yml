name: May backend checks at a may-app pull request head (typecheck, migrations, tests; pass or fail and counts only)
# The pull request number and head SHA only (both public in this log already): backend_ci_schedule.py reads it to run a
# head once.
run-name: 'May backend checks for may-app #${{ inputs.pr_number }} at ${{ inputs.source_sha }}'
on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Open May-Assistant/may-app pull request against main (not from a fork)
        required: true
        type: string
      source_sha:
        description: That pull request's current 40-character head commit
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: may-backend-unit-pr
  cancel-in-progress: false
jobs:
  admission:
    # may-app's backend-ci.yml (switched off there: private Actions are blocked by billing), run at the head of an open
    # may-app pull request on a free Linux runner: the pinned Node 22.22.0, a Postgres 16.15 service container pinned
    # by digest, then npm ci, typecheck, migrations from scratch twice with the ledger check, and npm test
    # (backend_unit.py STAGES). The same gate, fetch and environment as android-unit-pr.yml (gate.py --action
    # compile-pr: may-native-compile-pr, no required reviewer, main only), and the same split: pull mints the read
    # token and checks the pull request, backend runs the pull request's code with the two read-only deploy keys alone,
    # and post mints the comment token. Nothing is signed. Every stage's output stays in a private log, only fixed lines
    # with counts are printed, the one upload is the sealed record, and the failures go only to the may-app pull
    # request (backend_unit_post.py).
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      environment: ${{ steps.gate.outputs.environment }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          MAY_SOURCE_SHA: ${{ inputs.source_sha }}
          MAY_PR_NUMBER: ${{ inputs.pr_number }}
        run: python3 -I -S -B tools/may_release/gate.py --action compile-pr --source-sha "$MAY_SOURCE_SHA" --pr-number "$MAY_PR_NUMBER"
  pull:
    # The pull request check, on a runner that runs no pull request code: the May CI App's key is referenced only in jobs
    # like this one and post, never in the job that runs the pull request's own install scripts and tests as the runner
    # user, who has sudo and can read every secret that job references (independent review of may-releases #133).
    # backend needs it, and its fetch checks again that refs/pull/<number>/head is source_sha.
    needs: admission
    runs-on: ubuntu-24.04
    environment: ${{ needs.admission.outputs.environment }}
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Mint the May CI token for MAY_APP_PR_READ_TOKEN, before any pull request code
        id: ci-read
        if: vars.MAY_CI_APP_ID != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.MAY_CI_APP_ID }}
          private-key: ${{ secrets.MAY_CI_APP_PRIVATE_KEY }}
          owner: May-Assistant
          repositories: may-app
          permission-pull-requests: read
      - name: Check the pull request head and environment before fetching
        env:
          GH_TOKEN: ${{ github.token }}
          MAY_APP_PR_READ_TOKEN: ${{ steps.ci-read.outputs.token || secrets.MAY_APP_PR_READ_TOKEN }}
          MAY_SOURCE_SHA: ${{ inputs.source_sha }}
          MAY_PR_NUMBER: ${{ inputs.pr_number }}
        run: python3 -I -S -B tools/may_release/gate.py --action compile-pr --source-sha "$MAY_SOURCE_SHA" --pr-number "$MAY_PR_NUMBER" --check-pull
  backend:
    # The pull request's own install scripts, typecheck, migrations and tests, with the two read-only deploy keys in
    # its fetch and no other secret: its outcome and failures leave it only sealed to the environment's own age key,
    # and it fails when the checks failed.
    needs: [admission, pull]
    runs-on: ubuntu-24.04
    environment: ${{ needs.admission.outputs.environment }}
    # npm test alone stops at 25 minutes (backend_unit.TEST_SECONDS); the rest of the job takes about 2.
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    # backend-ci.yml's throwaway cluster: superuser may_admin with trust auth on the runner's loopback, which
    # backend_unit.py reaches as MAY_TEST_ADMIN_URL. Nothing in it outlives the job.
    services:
      postgres:
        image: postgres:16.15@sha256:ca0bd484cb98bf4b24eb1010e73fb3fcbd6714d240fbc1a10eea5b7dbecb641d
        env:
          POSTGRES_USER: may_admin
          POSTGRES_DB: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U may_admin -d postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install the pinned, checksum-verified Node
        run: python3 -I -S -B tools/may_release/toolchain.py node
      - name: Install pinned age, before any pull request code
        run: python3 -I -S -B tools/may_release/toolchain.py age
      # prepare.py's pull-request fetch, exactly as android-unit-pr.yml's: it also places the design system at its
      # Android pin, which the backend never reads.
      - name: Fetch the pull request head and pinned design system quietly
        env:
          MAY_SOURCE_SHA: ${{ inputs.source_sha }}
          MAY_PR_NUMBER: ${{ inputs.pr_number }}
          MAY_APP_READ_KEY: ${{ secrets.MAY_APP_READ_KEY }}
          MAY_DS_READ_KEY: ${{ secrets.MAY_DS_READ_KEY }}
        run: python3 -I -S -B tools/may_release/prepare.py --platform android --target playground --source-sha "$MAY_SOURCE_SHA" --pr-number "$MAY_PR_NUMBER"
      - name: Run the backend checks without any credential, printing only pass or fail and counts
        env:
          MAY_SOURCE_SHA: ${{ inputs.source_sha }}
        run: python3 -I -S -B tools/may_release/backend_unit.py --source-sha "$MAY_SOURCE_SHA" --record-outcome
      - name: Seal the backend failures for the post job, with no secret
        env:
          MAY_SOURCE_SHA: ${{ inputs.source_sha }}
          MAY_RENDERS_RECIPIENT: ${{ vars.MAY_RENDERS_RECIPIENT }}
        run: python3 -I -S -B tools/may_release/backend_unit_post.py seal --source-sha "$MAY_SOURCE_SHA"
      - name: Hand over only the sealed record
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: may-backend-unit-record-${{ github.run_attempt }}
          path: ${{ runner.temp }}/may-sealed/record.age
          if-no-files-found: ignore
          retention-days: 1
      - name: Fail if the checks failed
        run: python3 -I -S -B tools/may_release/backend_unit_post.py verdict
      # GitHub prints the service container's log here at teardown, so it must hold no statement text
      # (backend_unit.SILENCE_SQL); this fails the job, with a count alone, if it does.
      - name: Check the database log holds no statement text, never printing it
        if: always()
        env:
          MAY_PG_CONTAINER: ${{ job.services.postgres.id }}
        run: python3 -I -S -B tools/may_release/backend_unit.py --check-service-log "$MAY_PG_CONTAINER"
      - name: Remove private source, logs, dependencies and the pinned Node
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/may-source" "$RUNNER_TEMP/may-design-system" "$RUNNER_TEMP/may-private" "$RUNNER_TEMP/may-npm" "$RUNNER_TEMP/may-tools" "$RUNNER_TEMP/may-sealed"
  post:
    # A fresh runner that runs no may-app code: the comment token is minted here alone, the decrypt key and the comment
    # token each live in one step. It runs once backend has finished, passed or failed; with nothing sealed (no key
    # pair set yet) it posts nothing and backend's verdict stands.
    needs: [admission, backend]
    if: ${{ !cancelled() && needs.admission.result == 'success' }}
    runs-on: ubuntu-24.04
    environment: ${{ needs.admission.outputs.environment }}
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Mint the May CI token for MAY_APP_PR_COMMENT_TOKEN, before any pull request code
        id: ci-comment
        if: vars.MAY_CI_APP_ID != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.MAY_CI_APP_ID }}
          private-key: ${{ secrets.MAY_CI_APP_PRIVATE_KEY }}
          owner: May-Assistant
          repositories: may-app
          permission-pull-requests: write
      - name: Install pinned age
        run: python3 -I -S -B tools/may_release/toolchain.py age
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        # Nothing to download (no key pair yet, or backend stopped before its seal) is reported by the next step.
        continue-on-error: true
        with:
          name: may-backend-unit-record-${{ github.run_attempt }}
          path: ${{ runner.temp }}/may-sealed-download
      - name: Decrypt and check the record
        env:
          MAY_SOURCE_SHA: ${{ inputs.source_sha }}
          MAY_RENDERS_RECIPIENT: ${{ vars.MAY_RENDERS_RECIPIENT }}
          MAY_RENDERS_DECRYPT_KEY: ${{ secrets.MAY_RENDERS_DECRYPT_KEY }}
        run: python3 -I -S -B tools/may_release/backend_unit_post.py open --source-sha "$MAY_SOURCE_SHA"
      - name: Post the backend failures on the may-app pull request, never in this log
        env:
          MAY_SOURCE_SHA: ${{ inputs.source_sha }}
          MAY_PR_NUMBER: ${{ inputs.pr_number }}
          MAY_APP_PR_COMMENT_TOKEN: ${{ steps.ci-comment.outputs.token || secrets.MAY_APP_PR_COMMENT_TOKEN }}
        run: python3 -I -S -B tools/may_release/backend_unit_post.py post --source-sha "$MAY_SOURCE_SHA" --pr-number "$MAY_PR_NUMBER"
      - name: Remove the decrypted record
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/may-private" "$RUNNER_TEMP/may-sealed-download"
