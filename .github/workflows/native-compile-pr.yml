name: May iOS compile of a may-app pull request head (MayPlayground, simulator, no signing)
on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Open May-Assistant/may-app pull request against main (not from a fork)
        required: true
        type: string
      source_sha:
        description: That pull request's current 40-character head commit
        required: true
        type: string
      sandbox:
        description: Temporary (#161) - build as the unprivileged macOS user; the default, false, builds as today
        required: false
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: may-native-compile-pr
  cancel-in-progress: false
jobs:
  admission:
    # Compile evidence for an open may-app pull request (the iOS lane): May Playground only, simulator only, in its
    # own environment, never may-native-compile or a store environment. Admission has no environment, so a missing one
    # is denied on its 404 and never auto-created; it checks the inputs and that environment's policy (Samuel, 17 Oct:
    # compile-only runs need no approval, so no required reviewer, main only). The native job's first step then reads
    # the pull request with the token that environment holds: the current head of an open pull request against
    # may-app main, from may-app itself. The compile records its outcome privately; the post step alone, holding only
    # MAY_APP_PR_COMMENT_TOKEN, posts its errors (path:line:col and the compiler's message, never source) as one comment
    # on that private pull request and then fails the job if the compile failed. This repository is public: nothing
    # derived from may-app is printed, summarised or uploaded here (compile_pr_errors.py).
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      environment: ${{ steps.gate.outputs.environment }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          MAY_SOURCE_SHA: ${{ inputs.source_sha }}
          MAY_PR_NUMBER: ${{ inputs.pr_number }}
        run: python3 -I -S -B tools/may_release/gate.py --action compile-pr --source-sha "$MAY_SOURCE_SHA" --pr-number "$MAY_PR_NUMBER"
  pull:
    # The pull request check, on a Linux runner that runs no pull request code: the May CI App's key is referenced only
    # in jobs like this one, never in the job that compiles (independent review of may-releases #133). It mints the
    # read token and checks that the pull request is still open, against may-app main, from may-app itself, at
    # source_sha; native needs it, and its fetch checks again that refs/pull/<number>/head is source_sha.
    needs: admission
    runs-on: ubuntu-24.04
    environment: ${{ needs.admission.outputs.environment }}
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Mint the May CI token for MAY_APP_PR_READ_TOKEN, before any pull request code
        id: ci-read
        if: vars.MAY_CI_APP_ID != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.MAY_CI_APP_ID }}
          private-key: ${{ secrets.MAY_CI_APP_PRIVATE_KEY }}
          owner: May-Assistant
          repositories: may-app
          permission-pull-requests: read
      - name: Check the pull request head and environment before fetching
        env:
          GH_TOKEN: ${{ github.token }}
          MAY_APP_PR_READ_TOKEN: ${{ steps.ci-read.outputs.token || secrets.MAY_APP_PR_READ_TOKEN }}
          MAY_SOURCE_SHA: ${{ inputs.source_sha }}
          MAY_PR_NUMBER: ${{ inputs.pr_number }}
        run: python3 -I -S -B tools/may_release/gate.py --action compile-pr --source-sha "$MAY_SOURCE_SHA" --pr-number "$MAY_PR_NUMBER" --check-pull
  native:
    # The Mac compile starts only after the pull request check (pull) and may-app's Linux Swift checks (swift-checks)
    # pass. It runs the pull request's own build code, as the runner user by default, or with the sandbox input as
    # mac_sandbox.py's unprivileged user (compile.py --sandbox, #65; the input is temporary: once a sandboxed run is
    # green, the sandbox becomes the only path and the input goes). It references no GitHub App key and no token
    # (independent reviews of may-releases #130 and #133): only the two read-only deploy keys, in its fetch. It
    # seals its errors to the environment's own age key, hands over only that file, and fails when the compile failed;
    # the post job, on a fresh runner, posts them.
    needs: [admission, pull, swift-checks]
    runs-on: macos-15
    environment: ${{ needs.admission.outputs.environment }}
    timeout-minutes: 55
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install pinned age, before any pull request code
        run: python3 -I -S -B tools/may_release/toolchain.py age
      - name: Fetch the pull request head and pinned design system quietly
        env:
          MAY_SOURCE_SHA: ${{ inputs.source_sha }}
          MAY_PR_NUMBER: ${{ inputs.pr_number }}
          MAY_APP_READ_KEY: ${{ secrets.MAY_APP_READ_KEY }}
          MAY_DS_READ_KEY: ${{ secrets.MAY_DS_READ_KEY }}
        run: python3 -I -S -B tools/may_release/prepare.py --platform ios --target playground --source-sha "$MAY_SOURCE_SHA" --pr-number "$MAY_PR_NUMBER"
      - name: Compile without signing, store access or any credential
        if: ${{ !inputs.sandbox }}
        run: python3 -I -S -B tools/may_release/compile.py --platform ios --target playground --record-outcome
      - name: Compile as the unprivileged sandbox user, without signing, store access or any credential
        if: ${{ inputs.sandbox }}
        run: python3 -I -S -B tools/may_release/compile.py --platform ios --target playground --record-outcome --sandbox
      - name: Seal the errors for the post job, with no secret
        env:
          MAY_SOURCE_SHA: ${{ inputs.source_sha }}
          MAY_RENDERS_RECIPIENT: ${{ vars.MAY_RENDERS_RECIPIENT }}
        run: python3 -I -S -B tools/may_release/compile_pr_errors.py seal --source-sha "$MAY_SOURCE_SHA"
      - name: Hand over only the sealed record
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: may-compile-record-${{ github.run_attempt }}
          path: ${{ runner.temp }}/may-compile-sealed/compile.age
          if-no-files-found: ignore
          retention-days: 1
      - name: Fail if the compile failed
        run: python3 -I -S -B tools/may_release/compile_pr_errors.py verdict
      - name: Remove private source, logs and products
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/may-source" "$RUNNER_TEMP/may-design-system" "$RUNNER_TEMP/may-private" "$RUNNER_TEMP/may-derived" "$RUNNER_TEMP/may-packages" "$RUNNER_TEMP/may-gradle" "$RUNNER_TEMP/may-compile-sealed"
  swift-checks:
    # may-app's tools/ios/test_swift_*.py (may-app #1050) on Linux, before the macOS compile: an init's labels out of order
    # or a missing import fails here in a minute, and native never starts. The same check and fetch as native, with the
    # same secrets bound to the same steps; the checks run with none and print one fixed line, and the post alone holds
    # MAY_APP_PR_COMMENT_TOKEN and puts the failing checks on the may-app pull request (swift_checks.py). The checks are
    # the pull request's own code, so they run as sandbox.py's unprivileged user, never the runner user with its sudo.
    needs: admission
    runs-on: ubuntu-24.04
    environment: ${{ needs.admission.outputs.environment }}
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Mint the May CI token for MAY_APP_PR_READ_TOKEN, before any pull request code
        id: ci-read
        if: vars.MAY_CI_APP_ID != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.MAY_CI_APP_ID }}
          private-key: ${{ secrets.MAY_CI_APP_PRIVATE_KEY }}
          owner: May-Assistant
          repositories: may-app
          permission-pull-requests: read
      - name: Mint the May CI token for MAY_APP_PR_COMMENT_TOKEN, before any pull request code
        id: ci-comment
        if: vars.MAY_CI_APP_ID != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.MAY_CI_APP_ID }}
          private-key: ${{ secrets.MAY_CI_APP_PRIVATE_KEY }}
          owner: May-Assistant
          repositories: may-app
          permission-pull-requests: write
      - name: Check the pull request head and environment before fetching
        env:
          GH_TOKEN: ${{ github.token }}
          MAY_APP_PR_READ_TOKEN: ${{ steps.ci-read.outputs.token || secrets.MAY_APP_PR_READ_TOKEN }}
          MAY_SOURCE_SHA: ${{ inputs.source_sha }}
          MAY_PR_NUMBER: ${{ inputs.pr_number }}
        run: python3 -I -S -B tools/may_release/gate.py --action compile-pr --source-sha "$MAY_SOURCE_SHA" --pr-number "$MAY_PR_NUMBER" --check-pull
      - name: Fetch the pull request head and pinned design system quietly
        env:
          MAY_SOURCE_SHA: ${{ inputs.source_sha }}
          MAY_PR_NUMBER: ${{ inputs.pr_number }}
          MAY_APP_READ_KEY: ${{ secrets.MAY_APP_READ_KEY }}
          MAY_DS_READ_KEY: ${{ secrets.MAY_DS_READ_KEY }}
        run: python3 -I -S -B tools/may_release/prepare.py --platform ios --target playground --source-sha "$MAY_SOURCE_SHA" --pr-number "$MAY_PR_NUMBER"
      - name: Run the Swift checks without any credential, printing only pass or fail and a count
        env:
          MAY_SOURCE_SHA: ${{ inputs.source_sha }}
        run: python3 -I -S -B tools/may_release/swift_checks.py run --source-sha "$MAY_SOURCE_SHA"
      - name: Post the failing Swift checks on the may-app pull request, never in this log
        env:
          MAY_SOURCE_SHA: ${{ inputs.source_sha }}
          MAY_PR_NUMBER: ${{ inputs.pr_number }}
          MAY_APP_PR_COMMENT_TOKEN: ${{ steps.ci-comment.outputs.token || secrets.MAY_APP_PR_COMMENT_TOKEN }}
          MAY_CI_APP_SLUG: ${{ steps.ci-comment.outputs.app-slug }}
        run: python3 -I -S -B tools/may_release/swift_checks.py post --source-sha "$MAY_SOURCE_SHA" --pr-number "$MAY_PR_NUMBER"
      - name: Remove private source and logs
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/may-source" "$RUNNER_TEMP/may-design-system" "$RUNNER_TEMP/may-private"
  core:
    needs: admission
    runs-on: ubuntu-24.04
    environment: ${{ needs.admission.outputs.environment }}
    # The build and tests stop at 25 minutes together (ios_core.RUN_SECONDS); the 1 GB toolchain and the fetch take the
    # rest.
    timeout-minutes: 35
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Mint the May CI token for MAY_APP_PR_READ_TOKEN, before any pull request code
        id: ci-read
        if: vars.MAY_CI_APP_ID != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.MAY_CI_APP_ID }}
          private-key: ${{ secrets.MAY_CI_APP_PRIVATE_KEY }}
          owner: May-Assistant
          repositories: may-app
          permission-pull-requests: read
      - name: Mint the May CI token for MAY_APP_PR_COMMENT_TOKEN, before any pull request code
        id: ci-comment
        if: vars.MAY_CI_APP_ID != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.MAY_CI_APP_ID }}
          private-key: ${{ secrets.MAY_CI_APP_PRIVATE_KEY }}
          owner: May-Assistant
          repositories: may-app
          permission-pull-requests: write
      - name: Install the pinned, checksum-verified Swift
        run: python3 -I -S -B tools/may_release/toolchain.py swift
      - name: Check the pull request head and environment before fetching
        env:
          GH_TOKEN: ${{ github.token }}
          MAY_APP_PR_READ_TOKEN: ${{ steps.ci-read.outputs.token || secrets.MAY_APP_PR_READ_TOKEN }}
          MAY_SOURCE_SHA: ${{ inputs.source_sha }}
          MAY_PR_NUMBER: ${{ inputs.pr_number }}
        run: python3 -I -S -B tools/may_release/gate.py --action compile-pr --source-sha "$MAY_SOURCE_SHA" --pr-number "$MAY_PR_NUMBER" --check-pull
      - name: Fetch the pull request head and pinned design system quietly
        env:
          MAY_SOURCE_SHA: ${{ inputs.source_sha }}
          MAY_PR_NUMBER: ${{ inputs.pr_number }}
          MAY_APP_READ_KEY: ${{ secrets.MAY_APP_READ_KEY }}
          MAY_DS_READ_KEY: ${{ secrets.MAY_DS_READ_KEY }}
        run: python3 -I -S -B tools/may_release/prepare.py --platform ios --target playground --source-sha "$MAY_SOURCE_SHA" --pr-number "$MAY_PR_NUMBER"
      # The pull request's Swift runs as an unprivileged user with no sudo, in its own copies (sandbox.py),
      # so it cannot reach the post step below, its token, the tools or this job's files.
      - name: Build and test MayCore without any credential, printing only pass or fail and counts
        env:
          MAY_SOURCE_SHA: ${{ inputs.source_sha }}
        run: python3 -I -S -B tools/may_release/ios_core.py run --source-sha "$MAY_SOURCE_SHA"
      - name: Post the MayCore failures on the may-app pull request, never in this log
        env:
          MAY_SOURCE_SHA: ${{ inputs.source_sha }}
          MAY_PR_NUMBER: ${{ inputs.pr_number }}
          MAY_APP_PR_COMMENT_TOKEN: ${{ steps.ci-comment.outputs.token || secrets.MAY_APP_PR_COMMENT_TOKEN }}
          MAY_CI_APP_SLUG: ${{ steps.ci-comment.outputs.app-slug }}
        run: python3 -I -S -B tools/may_release/ios_core.py post --source-sha "$MAY_SOURCE_SHA" --pr-number "$MAY_PR_NUMBER"
      - name: Remove private source, logs, build outputs and the pinned Swift
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/may-source" "$RUNNER_TEMP/may-design-system" "$RUNNER_TEMP/may-private" "$RUNNER_TEMP/may-tools"
  post:
    # A fresh Linux runner that runs no may-app code: the comment token is minted here alone, the decrypt key and the
    # comment token each live in one step, and the record is checked whole before it is posted. It runs once native has
    # finished, passed or failed; with nothing sealed (no key pair set yet) it posts native's result line alone, with no
    # detail, still head-marked, so the may-app merge gate is never left without a result.
    needs: [admission, native]
    # A sandboxed run (the temporary sandbox input, #161) posts nothing: it is an experiment, never the pull request's
    # own iOS check (coordinator, 31 Oct, run 41170609342).
    if: ${{ !cancelled() && needs.admission.result == 'success' && !inputs.sandbox }}
    runs-on: ubuntu-24.04
    environment: ${{ needs.admission.outputs.environment }}
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Mint the May CI token for MAY_APP_PR_COMMENT_TOKEN, before any pull request code
        id: ci-comment
        if: vars.MAY_CI_APP_ID != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.MAY_CI_APP_ID }}
          private-key: ${{ secrets.MAY_CI_APP_PRIVATE_KEY }}
          owner: May-Assistant
          repositories: may-app
          permission-pull-requests: write
      - name: Install pinned age
        run: python3 -I -S -B tools/may_release/toolchain.py age
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        # Nothing to download (no key pair yet, or native stopped before its seal) is reported by the next step.
        continue-on-error: true
        with:
          name: may-compile-record-${{ github.run_attempt }}
          path: ${{ runner.temp }}/may-compile-download
      - name: Decrypt and check the compile record
        env:
          MAY_SOURCE_SHA: ${{ inputs.source_sha }}
          MAY_RENDERS_RECIPIENT: ${{ vars.MAY_RENDERS_RECIPIENT }}
          MAY_RENDERS_DECRYPT_KEY: ${{ secrets.MAY_RENDERS_DECRYPT_KEY }}
        run: python3 -I -S -B tools/may_release/compile_pr_errors.py open --source-sha "$MAY_SOURCE_SHA"
      - name: Post the errors on the may-app pull request, never in this log
        env:
          MAY_SOURCE_SHA: ${{ inputs.source_sha }}
          MAY_PR_NUMBER: ${{ inputs.pr_number }}
          MAY_APP_PR_COMMENT_TOKEN: ${{ steps.ci-comment.outputs.token || secrets.MAY_APP_PR_COMMENT_TOKEN }}
          MAY_NATIVE_RESULT: ${{ needs.native.result }}
          MAY_CI_APP_SLUG: ${{ steps.ci-comment.outputs.app-slug }}
        run: python3 -I -S -B tools/may_release/compile_pr_errors.py post --source-sha "$MAY_SOURCE_SHA" --pr-number "$MAY_PR_NUMBER"
      - name: Remove the decrypted record
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/may-private" "$RUNNER_TEMP/may-compile-download"
