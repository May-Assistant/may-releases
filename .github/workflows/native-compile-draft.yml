name: May iOS compile (MayPlayground, simulator, no signing)
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Native platform to compile without signing or upload (iOS only; Android compiles in the flows and store builds)
        required: true
        type: choice
        options: [ios]
      source_sha:
        description: Reviewed 40-character May app commit already on main
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: may-native-compile
  cancel-in-progress: false
jobs:
  admission:
    # Active for iOS (each build, dispatched by the coordinator): May Playground only, the internal target, so it
    # builds at iOS's own design-system pin (store.design_system_pins); the May scheme waits for the re-pin.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      environment: ${{ steps.gate.outputs.environment }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          MAY_SOURCE_SHA: ${{ inputs.source_sha }}
        run: python3 tools/may_release/gate.py --action compile --source-sha "$MAY_SOURCE_SHA"
  native:
    needs: admission
    if: ${{ inputs.platform == 'ios' }}
    runs-on: macos-15
    environment: ${{ needs.admission.outputs.environment }}
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Recheck protection after reviewer approval
        env:
          GH_TOKEN: ${{ github.token }}
          MAY_SOURCE_SHA: ${{ inputs.source_sha }}
        run: python3 tools/may_release/gate.py --action compile --source-sha "$MAY_SOURCE_SHA"
      - name: Fetch exact private app and pinned design system quietly
        env:
          MAY_SOURCE_SHA: ${{ inputs.source_sha }}
          MAY_APP_READ_KEY: ${{ secrets.MAY_APP_READ_KEY }}
          MAY_DS_READ_KEY: ${{ secrets.MAY_DS_READ_KEY }}
        run: python3 tools/may_release/prepare.py --platform ios --target playground --source-sha "$MAY_SOURCE_SHA"
      - name: Compile without signing or store access
        run: python3 tools/may_release/compile.py --platform ios --target playground
      - name: Remove private source, logs and products
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/may-source" "$RUNNER_TEMP/may-design-system" "$RUNNER_TEMP/may-private" "$RUNNER_TEMP/may-derived" "$RUNNER_TEMP/may-packages" "$RUNNER_TEMP/may-gradle"
